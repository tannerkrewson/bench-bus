# Artificial Analysis Intelligence Index collector.
#
# Cron scheduling is disabled indefinitely. Run manually via workflow_dispatch.

name: Collect Artificial Analysis models

on:
  workflow_dispatch:

# Overlapping runs queue instead of racing on the data branch.
concurrency:
  group: collect-aa
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Required only to push snapshots to bench-bus-data.
      contents: write
    steps:
      - name: Checkout application source (main)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout data branch (bench-bus-data)
        uses: actions/checkout@v4
        with:
          ref: bench-bus-data
          path: data-branch
          fetch-depth: 1
          # Credentials are required for the snapshot push at the end of the
          # composite action; scoped to this job only.
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Collect, validate, store, and push snapshot
        uses: ./.github/actions/collect-and-store
        with:
          source: aa
          collector-command: collect:aa
