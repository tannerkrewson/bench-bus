# OpenRouter effective-pricing collector (six times daily).
#
# NOTE ON SCHEDULING: GitHub scheduled workflows are best-effort — they can be
# delayed or dropped during high-load periods. Bench Bus is designed to
# tolerate stale snapshots: the frontend surfaces data freshness instead of
# breaking, and missed runs simply leave the last-known-good data in place.
# Manual recovery is available via workflow_dispatch.

name: Collect OpenRouter pricing

on:
  schedule:
    # Six times daily in UTC. GitHub cron is UTC-only; the 21:00 UTC run is
    # 5pm ET during daylight time and 4pm ET during standard time.
    - cron: "0 1,5,9,13,17,21 * * *"
  workflow_dispatch:

# Overlapping runs queue instead of racing on the data branch.
concurrency:
  group: collect-openrouter
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Required only to push snapshots to bench-bus-data.
      contents: write
    steps:
      - name: Checkout application source (main)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout data branch (bench-bus-data)
        uses: actions/checkout@v4
        with:
          ref: bench-bus-data
          path: data-branch
          fetch-depth: 1
          # Credentials are required for the snapshot push at the end of the
          # composite action; scoped to this job only.
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Collect, validate, store, and push snapshot
        uses: ./.github/actions/collect-and-store
        with:
          source: openrouter
          collector-command: collect:openrouter
