# DeepSWE leaderboard collector.
#
# NOTE ON SCHEDULING: GitHub scheduled workflows are best-effort. Bench Bus
# tolerates delayed runs by retaining the last-known-good source snapshot.
name: Collect DeepSWE scores

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

concurrency:
  group: collect-deepswe
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout application source (main)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout data branch (bench-bus-data)
        uses: actions/checkout@v4
        with:
          ref: bench-bus-data
          path: data-branch
          fetch-depth: 1
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Collect, validate, store, and push snapshot
        uses: ./.github/actions/collect-and-store
        with:
          source: deepswe
          collector-command: collect:deepswe
