<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Bench Bus — AI benchmark scores versus estimated benchmark workload cost."
    />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#F7B53A" />
    <title>Bench Bus</title>
    <script>
      (() => {
        const lightThemes = ["light", "caramellatte", "cupcake", "pastel", "valentine", "retro", "garden", "lofi", "fantasy", "wireframe", "cmyk", "autumn", "acid", "lemonade", "winter", "nord", "silk", "emerald", "corporate", "bumblebee"];
        const darkThemes = ["dark", "halloween", "synthwave", "forest", "aqua", "black", "luxury", "dracula", "business", "night", "coffee", "dim", "sunset", "abyss"];
        const themes = [...lightThemes, ...darkThemes];
        let theme = null;
        try {
          theme = window.localStorage.getItem("bench-bus-theme");
        } catch {
          // Storage can be unavailable in private browsing.
        }
        if (theme === "light") theme = "caramellatte";
        if (theme === "dark") theme = "halloween";
        if (!themes.includes(theme)) {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "halloween" : "caramellatte";
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
